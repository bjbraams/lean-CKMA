name = "CKMA"
version = "0.1.0"
defaultTargets = ["CKMA"]
buildDir = ".lake/build-CKMA"

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[lean_lib]]
name = "CKMA"
globs = ["CKMA", "CKMA.+"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0"

[[require]]
name = "TauCeti"
git = "https://github.com/TauCetiProject/TauCeti"
rev = "v4.36.0"
